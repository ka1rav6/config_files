# =============================================================================
# xdg-desktop-portal routing under Hyprland.
# =============================================================================
# The portal is how sandboxed and toolkit-agnostic applications ask the desktop
# to do things they cannot do themselves: open a file picker, share a screen,
# ask what colour scheme to use. Several backends implement those interfaces
# and xdg-desktop-portal picks one PER INTERFACE from this file. The filename
# matters: `<XDG_CURRENT_DESKTOP lowercased>-portal.conf`, and
# ~/.config/hypr/env.lua sets XDG_CURRENT_DESKTOP=Hyprland.
#
# Without this file the choice is whatever alphabetical order and the installed
# .portal files happen to produce -- which on this machine means the GNOME
# backend can win ScreenCast and hand every screen-sharing app a black frame,
# because it talks to Mutter and there is no Mutter here.
#
# WHY TWO BACKENDS AND NOT ONE
#   xdg-desktop-portal-hyprland is the only backend that can actually see this
#   compositor: it speaks wlr-screencopy and hyprland-global-shortcuts, so it
#   is the only correct answer for screen capture and for global shortcuts.
#   It deliberately implements nothing else.
#
#   xdg-desktop-portal-gtk supplies everything else, and is the reason this is
#   worth configuring at all: it provides FileChooser (so Chromium, Zoom and
#   every Flatpak get a real GTK file dialog instead of their own built-in one)
#   and Settings, which is how those same applications learn the desktop is
#   dark and what the accent colour is. `theme-switch` writes that accent, so
#   this file is what carries a theme switch into Electron and Flatpak apps.
#
# After editing:  systemctl --user restart xdg-desktop-portal.service
# To verify:      just portal-check
# =============================================================================

[preferred]
# Everything not named below goes to GTK. That is the safe default: it is the
# most complete backend, and any interface it lacks falls through to whatever
# else implements it.
default=gtk

# --- must be hyprland ------------------------------------------------------
# Screen capture and screenshots. wlr-screencopy against this compositor; the
# GNOME backend would answer and then fail, so name hyprland explicitly rather
# than relying on it losing a tiebreak.
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland

# Application-defined global shortcuts (Discord push-to-talk, OBS hotkeys).
# Only the Hyprland backend can register these with the compositor.
org.freedesktop.impl.portal.GlobalShortcuts=hyprland

# --- must be gtk -----------------------------------------------------------
# The file dialogs. GTK's picker honours ~/.config/gtk-3.0/bookmarks, which is
# the whole point of routing it here.
org.freedesktop.impl.portal.FileChooser=gtk

# Dark-mode and accent-colour broadcast. Chromium, VS Code, Spotify and every
# Flatpak read the active theme through this interface; it is what makes
# `just theme <name>` reach applications that know nothing about this config.
org.freedesktop.impl.portal.Settings=gtk

# Notifications, opening URIs, the "an app wants to inhibit sleep" prompts, and
# the secret store -- all GTK, all with a dialog that matches the GTK theme
# matugen just wrote.
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.OpenURI=gtk
org.freedesktop.impl.portal.Inhibit=gtk
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Account=gtk
org.freedesktop.impl.portal.Print=gtk
org.freedesktop.impl.portal.Email=gtk
org.freedesktop.impl.portal.Wallpaper=gtk
