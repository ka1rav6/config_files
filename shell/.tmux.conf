# =========================
# GENERAL
# =========================

# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Faster escape
set -sg escape-time 10

# Pass focus-in/focus-out from the terminal through to programs inside tmux.
# Neovim relies on these to run `autoread` checks, so a file changed on disk
# (git checkout, a formatter, another editor) reloads when you switch back to
# the pane. `:checkhealth` flags this as missing without it.
set -g focus-events on

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically
set -g renumber-windows on

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# =========================
# TRUE COLOR
# =========================

# terminal-features RGB is the tmux 3.2+ way to declare 24-bit colour. The
# older `terminal-overrides ",*:Tc"` line that used to sit here did the same
# job and has been dropped.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Required for molten-nvim / terminal graphics to survive tmux, and for OSC 52
# yanks from nvim to reach the Wayland clipboard.
set -g allow-passthrough on
set -g set-clipboard on

# =========================
# MOUSE
# =========================

set -g mouse on

# =========================
# SPLITS & NEW WINDOWS
# =========================

# New panes and windows open in the directory of the pane you split from,
# instead of the directory the tmux session was started in.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

unbind '"'
unbind %

# =========================
# VIM-LIKE PANE MOVEMENT
# =========================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# =========================
# RESIZE PANES
# =========================

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =========================
# COPY MODE
# =========================

setw -g mode-keys vi

# =========================
# BETTER SCROLLBACK
# =========================

set -g history-limit 100000

# =========================
# STATUS BAR
# =========================

set -g status-position bottom
set -g status-justify centre

# Window tabs. Colours for these come from the theme block below.
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# =========================
# COLOURS
# =========================
#
# Everything between the markers is rewritten by `just theme <name>`, so it
# always matches ghostty, waybar and the rest of the desktop. Change colours by
# switching theme, or by editing the palette in ~/.local/bin/theme-switch --
# hand edits inside the block are lost on the next switch.

# THEME:START -- generated by ~/.local/bin/theme-switch, do not edit by hand
set -g status-style "bg=#1b2527,fg=#f4f7fa"
setw -g window-status-style "fg=#bec7d0"
setw -g window-status-current-style "bg=#8ee3c1,fg=#121418,bold"
set -g pane-border-style "fg=#3b4a4d"
set -g pane-active-border-style "fg=#8ee3c1"
set -g message-style "bg=#8ee3c1,fg=#121418"
set -g message-command-style "bg=#f4c47b,fg=#121418"
set -g mode-style "bg=#203332,fg=#f4f7fa"
set -g display-panes-active-colour "#8ee3c1"
set -g display-panes-colour "#bec7d0"
setw -g clock-mode-colour "#8ee3c1"
# THEME:END
