# =========================
# GENERAL
# =========================

# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Faster escape
set -sg escape-time 10

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically
set -g renumber-windows on

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# =========================
# TRUE COLOR
# =========================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# =========================
# MOUSE
# =========================

set -g mouse on

# =========================
# SPLITS
# =========================

bind | split-window -h
bind - split-window -v

unbind '"'
unbind %

# =========================
# VIM-LIKE PANE MOVEMENT
# =========================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# =========================
# RESIZE PANES
# =========================

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =========================
# COPY MODE
# =========================

setw -g mode-keys vi

# =========================
# STATUS BAR
# =========================

set -g status-position bottom
set -g status-justify centre

# =========================
# BETTER SCROLLBACK
# =========================

set -g history-limit 100000

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Better status bar
set -g status-position bottom
set -g status-style "bg=colour234,fg=white"

# Window tabs
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[bold]#I:#W "

# Message colors
set -g message-style "bg=colour39,fg=black"

# Pane number display
set -g display-panes-active-colour colour39
set -g display-panes-colour colour245
