<script>

$(document).ready(function(){
  // checks if the CSV file was loaded correctly
    var visible = false;
  //Check to see if the window is top if not then display button
  $(window).scroll(function() {
    var scrollTop = $(this).scrollTop();
    if (!visible && scrollTop > 100) {
      $(".scrollToTop").fadeIn();
      visible = true;
    } else if (visible && scrollTop <= 100) {
      $(".scrollToTop").fadeOut();
      visible = false;
    }
  });
  //Click event to scroll to top
  $(".scrollToTop").click(function() {
    $("html, body").animate({
      scrollTop: 0
    }, 800);
    return false;
  });

  var courseTable = $('#data-table').DataTable({
    "ajax": '{{ url_for( 'static' , filename='Courses.json') }}',
    "fixedHeader": {
      header: true,
      headerOffset: -6
    },
    "paging": false,
    responsive: true,
    "sScrollX": "100%",
    "lengthMenu": [[20, 50, 100, 500, -1], [20, 50, 100, 500, "All"]],
    "columnDefs": [{ className: "details-control", "targets": [ 0 ] }],
    "columns" :  [
      {"targets": 0,
        data : "",
        // "render": function(data, type, row, meta)
        // {
        //   return '<img src = {{ url_for("static", filename="plus.png") }} width = 20px height = 20px>'
        // }
      },
      { "targets": 0,
        data: "Course Name",
        "render": function (data, type, row, meta) {
        var cname=data.substring(0,data.indexOf("#")).trim();
        var link=data.substring(data.indexOf("?=")+2).trim();

          return '<a href="/viewDescription/filename?='+link+'" rel="noopener noreferrer" target="_blank">'+cname+'</a>';}
        // Hyperlinking the course name with the drive link
      },
      { data : "Course Acronym" },
      { data : "Course Code" },
{ data : "Prerequisites",
    "render": function(data, type, row, meta)
      {
        if(data=="None" || data=="")
        {
          return "None";
        }
        return data;
      }},
{ data : "Antirequisites",
      "render": function(data, type, row, meta)
        {
          if(data=="None" || data=="")
          {
            return "None";
          }
          return data;
        }
    },
      { data : "Semester"}

     ]
  });

  var departments = ["CSE", "ECE", "MTH", "BIO", "DES", "SSH", "OTHERS"];

  var checkboxes = departments.reduce((html, item) => html += `<input type="checkbox" value="${item}" class="filter"><b>${" "+item}</b></input> &emsp;`,'');
  $(checkboxes).insertBefore($('#departments'));

  var lookupValues = [];
  $.fn.DataTable.ext.search.push((settings, row, index, rowObj) => lookupValues.indexOf(rowObj.Cluster) > -1 || lookupValues.indexOf(rowObj.OptionalDept)>-1 || lookupValues.length == 0);
  //watch checkboxes and redraw table on change accordingly
  $(".filter").on('change', () => {
    lookupValues = [...$('.filter:checked')].map(checkbox => $(checkbox).val());
    courseTable.draw();
  });

  function format (data) {
    return '<div class="slider" name>'+
           '<table>'+
             '<tr>'+
               '<td>'+
                  "<b>Professor(s):</b> "+data.Professor+
               '</td>'+
              '</tr>'+
              '<tr>'+
               '<td>'+
                  "<b>Preferable Prerequisites:</b> "+data.Preferable_Prerequisites+
               '</td>'+
              '</tr>'+
              '<tr>'+
               '<td>'+
                  "<b>Credits:</b> "+data.Credits+
               '</td>'+
             '</tr>'+
           '</table>'+
         '</div>'
  }

  $('#data-table tbody').on('click', 'td.details-control', function () {
      var tr = $(this).closest('tr');
      var row = courseTable.row( tr );

      if ( row.child.isShown() ) {
          //This row is already open - close it
          $('div.slider', row.child()).slideUp( function () {
              row.child.hide();
              tr.removeClass('shown');
          } );
      }
      else {
          // Open this row
          row.child( format(row.data()), 'no-padding' ).show();
          tr.addClass('shown');
          $('div.slider', row.child()).slideDown();
      }
    });


});
</script>
