general {
    # EVERY lock path goes through ~/.local/bin/lock-session -- this listener,
    # before_sleep_cmd below, SUPER+ESCAPE in bindings.lua, and the Lock button
    # in ~/.config/wlogout/layout. One entry point means one policy: it picks
    # the Quickshell locker when Settings.features.lockScreen is on, falls back
    # to hyprlock otherwise, and relaunches hyprlock if the locker dies holding
    # the session.
    #
    # DO NOT call a locker directly from here again. Doing so bypasses that
    # script's flock, and a second locker arriving on top of a live one is what
    # produced the lockout this whole arrangement exists to prevent -- see the
    # header in lock-session.
    #
    # The `--grace 5` that used to be on this line lives in lock-session now,
    # applied only on the hyprlock fallback path (the Quickshell locker has no
    # grace period by design). There is no longer a number to keep in step
    # between this file and wlogout.
    lock_cmd = ~/.local/bin/lock-session
    before_sleep_cmd = loginctl lock-session
    # Lua config: `hyprctl dispatch <old syntax>` is evaluated as Lua now, so
    # the bare `dpms on` form silently threw a parse error and never ran.
    # Use `action` explicitly; omitting it defaults to toggling DPMS.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Dim as a warning before the lock lands, so the lock isn't a surprise.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# DPMS-off listener removed deliberately -- do not restore it while aquamarine
# is at 0.15.0. `dpms off` there disables the eDP connector and releases the
# CRTC; the later re-enable hangs inside the DRM atomic commit and wedges the
# panel until Hyprland is restarted (aquamarine #293). The 240s listener above
# already dims the backlight to 10%, which covers most of the same ground.

# Idle suspend, gated on battery level. As long as BAT0 is above 20% this
# never fires -- whether or not the laptop is plugged in. See the script for
# why it polls instead of checking once: hypridle evaluates on-timeout a single
# time and never revisits it while the session stays idle.
listener {
    timeout = 900
    on-timeout = $HOME/.config/hypr/scripts/idle-suspend.sh start
    on-resume = $HOME/.config/hypr/scripts/idle-suspend.sh stop
}
