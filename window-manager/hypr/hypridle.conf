general {
    # --grace 5: five seconds after the lock appears, any keypress dismisses
    # it without a password. This used to be `grace = 5` inside general{} in
    # hyprlock.conf, but hyprlock v0.9.6 dropped that option and silently
    # ignored it, so the grace period was not actually in effect. It is a
    # command-line flag now. The Lock button in ~/.config/wlogout/layout
    # passes the same value -- keep the two in step.
    #
    # `pidof hyprlock ||` prevents a second instance stacking on the first.
    lock_cmd = pidof hyprlock || hyprlock --grace 5
    before_sleep_cmd = loginctl lock-session
    # Lua config: `hyprctl dispatch <old syntax>` is evaluated as Lua now, so
    # the bare `dpms on` form silently threw a parse error and never ran.
    # `dpms on` alone is not enough on aquamarine 0.15.0: the lid-close output
    # disable is not undone on resume, so the panel lights up for about a second
    # and then has no scanout (aquamarine #293 / #304). A reload is the only
    # thing that re-enables the output -- dpms on and a VT switch both no-op.
    # The sleep lets Hyprland finish its own (failed) re-enable first.
    # Drop the reload once aquamarine > 0.15.0 lands in the PPA.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ state = "on" })'; sleep 1; hyprctl reload
}

# Dim as a warning before the lock lands, so the lock isn't a surprise.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ state = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ state = "on" })'
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
