# =============================================================================
# hyprpaper — wallpaper daemon
# =============================================================================
# Started once at login from ~/.config/hypr/autostart.lua. It stays resident,
# holding the decoded image in memory so wallpaper changes are instant.
#
# Reload without restarting:  hyprctl hyprpaper reload ,<path>
# -----------------------------------------------------------------------------

# Pulls in $wallpaper. Shared with hyprlock so the desktop and the lock screen
# never drift apart.
source = ~/.config/hypr/wallpaper.conf

# Two blocks, deliberately. hyprpaper matches the most specific rule first:
#
#   eDP-1  — the laptop's internal panel, named explicitly.
#   (blank)— the catch-all, applied to every other output. Without it, plugging
#            in the HDMI monitor gives you a black desktop on that screen.
#
# fit_mode = cover scales the image to fill the output and crops the overflow,
# preserving aspect ratio. The alternatives are `contain` (fit inside, letterbox
# the remainder), `stretch` (fill by distorting), and `tile`.
wallpaper {
    monitor = eDP-1
    path = $wallpaper
    fit_mode = cover
}

wallpaper {
    monitor =
    path = $wallpaper
    fit_mode = cover
}

# Skip the hyprpaper splash overlay on startup.
splash = false

# Keep the IPC socket open so `hyprctl hyprpaper ...` can drive the daemon at
# runtime. Required by ~/.config/hypr/scripts/apply-wallpaper.sh — turning this
# off would leave that script with no way to swap the wallpaper.
ipc = true
