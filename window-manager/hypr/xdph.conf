# =============================================================================
# xdg-desktop-portal-hyprland
# =============================================================================
# The half of the portal stack that can actually see this compositor: screen
# capture, screenshots and global shortcuts. Which requests reach it at all is
# decided one level up, in ~/.config/xdg-desktop-portal/hyprland-portal.conf.
#
# This file is xdph's own configuration -- Hyprland config syntax, read from
# ~/.config/hypr/xdph.conf, and NOT part of hyprland.conf. It is not Lua: xdph
# parses it with hyprlang directly, so the `hl.` DSL used by every other file in
# this directory does not apply here.
#
# After editing:  systemctl --user restart xdg-desktop-portal-hyprland.service
# =============================================================================

screencopy {
    # The dialog that asks which screen or window to share. Pointed at a wrapper
    # that adds a Qt stylesheet generated by `theme-switch`, so the picker
    # matches the rest of the desktop and shows a visible keyboard focus ring.
    # The wrapper falls back to the stock picker when the stylesheet is missing.
    #
    # THE PATH MUST BE ABSOLUTE. hyprlang does not expand `~`, and xdph does not
    # either -- it execs this string as given. A `~/...` path here fails
    # silently: no picker window appears, the log says only
    # "SHAREDATA returned selection -1", and every screen share is refused with
    # no visible error in the application asking for it.
    custom_picker_binary = /home/kairav/.local/bin/hyprland-share-picker-themed

    # Show the cursor in shared video. 1 = always, 0 = never, 2 = only when the
    # capturing application asks for it.
    cursor_mode = 2

    # Leave the "Allow a restore token" box UNCHECKED by default. A restore
    # token lets an application skip this dialog entirely next time, which is
    # convenient and is also exactly the permission worth granting deliberately
    # rather than by default.
    allow_token_by_default = false
}
