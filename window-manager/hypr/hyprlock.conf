source = ~/.config/hypr/wallpaper.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    immediate_render = true
    grace = 5
    disable_loading_bar = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 1
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(255, 255, 255, 0.35)
    check_color = rgba(0, 255, 153, 1.0)
    fail_color = rgba(255, 102, 51, 1.0)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Enter Password
    fail_text = $FAIL
    dots_spacing = 0.3
    dots_center = true
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(255, 255, 255)
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT
    color = rgb(255, 255, 255)
    font_size = 16
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = -10, 10
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3000] $HOME/.config/hypr/scripts/lock-battery.sh
    color = rgba(255, 255, 255, 1.0)
    font_size = 15
    font_family = $font
    position = 12, 38
    halign = left
    valign = bottom
}

label {
    monitor =
    text = $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 16
    font_family = $font
    position = 10, 10
    halign = left
    valign = bottom
}
