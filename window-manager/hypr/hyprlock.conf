# =============================================================================
# hyprlock — lock screen
# =============================================================================
# Invoked from three places, all of which must agree that this file is the
# config:
#   * wlogout's "Lock" button (~/.config/wlogout/layout)
#   * hypridle's lock_cmd after 5 minutes idle (~/.config/hypr/hypridle.conf)
#   * loginctl lock-session, i.e. before suspend
#
# TEST CHANGES CAREFULLY. A config error here can leave you at a lock screen
# that will not accept input. The safe way to try an edit is to run `hyprlock`
# from a terminal on another workspace, so a broken run is one Ctrl+C away
# rather than a reboot.
#
# Syntax is Hyprland's own: `key = value`, `section { ... }` blocks, `#` for
# comments, `$name = value` for variables.
# -----------------------------------------------------------------------------

# Pulls in $wallpaper, shared with hyprpaper so the lock screen shows the same
# image as the desktop rather than drifting out of sync.
source = ~/.config/hypr/wallpaper.conf

# Nerd Font, matching Ghostty and waybar. Assigned once and referenced below, so
# changing the typeface is a one-line edit.
$font = JetBrainsMono Nerd Font


general {
    # Keep the mouse cursor visible, so it is obvious the machine is awake and
    # responding rather than hung.
    hide_cursor = false

    # Draw the lock surface on the first frame instead of waiting for the
    # wallpaper to decode. Without it there is a brief window where the desktop
    # is still readable underneath — a real, if short, information leak.
    immediate_render = true

    # NOTE: `grace` and `disable_loading_bar` used to live here and were
    # REMOVED because hyprlock v0.9.6 no longer accepts them in this block.
    # They were not doing anything -- every launch logged:
    #     Config error ... config option <general:grace> does not exist.
    #     Config error ... config option <general:disable_loading_bar> does not exist.
    # so the intended 5-second grace period had silently not been in effect.
    #
    # grace is now a command-line flag. The callers pass it explicitly:
    #     hyprlock --grace 5
    # See lock_cmd in ~/.config/hypr/hypridle.conf and the Lock action in
    # ~/.config/wlogout/layout. Change the number in BOTH places, or neither.
    #
    # Verify this file after any edit -- errors are reported at launch:
    #     hyprlock --version >/dev/null; grep -i 'config error' <(hyprlock -v 2>&1)
}


animations {
    enabled = true
    # A straight line from 0 to 1 — no easing. The lock screen fades rather than
    # springs, which suits it; easing curves here read as sluggish.
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}


background {
    # blank = apply to every output
    monitor =
    path = $wallpaper
    # One blur pass. Enough to make the desktop unreadable behind the lock,
    # while staying cheap — this renders on a machine that has just woken up.
    blur_passes = 1
}


# --- Password field ----------------------------------------------------------
input-field {
    monitor =
    # relative to the output, so it scales per monitor
    size = 20%, 5%
    outline_thickness = 3

    # transparent fill — wallpaper shows
    inner_color = rgba(0, 0, 0, 0.0)
    # idle border
    outer_color = rgba(255, 255, 255, 0.35)

    # The border colour doubles as the status indicator, which is the only
    # feedback the lock screen gives:
    # green  — verifying your password
    check_color = rgba(0, 255, 153, 1.0)
    # orange — wrong password
    fail_color  = rgba(255, 102, 51, 1.0)
    font_color  = rgb(255, 255, 255)

    # Keep the field drawn when empty. With this false the field vanishes
    # between attempts, which makes the screen look unresponsive.
    fade_on_empty = false

    rounding = 15
    font_family = $font
    placeholder_text = Enter Password

    # $FAIL expands to hyprlock's own failure message, including the attempt
    # count from PAM.
    fail_text = $FAIL

    dots_spacing = 0.3
    dots_center = true

    # Positioned relative to the anchor set by halign/valign: centred, nudged
    # 20px up so it sits above the optical middle rather than dead centre.
    position = 0, -20
    halign = center
    valign = center
}


# --- Clock (top right) -------------------------------------------------------
label {
    monitor =
    # built-in variable, updates every second
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 90
    font_family = $font
    # negative x = inset from the right edge
    position = -30, 0
    halign = right
    valign = top
}


# --- Date, under the clock ---------------------------------------------------
label {
    monitor =
    # cmd[update:60000] runs a shell command every 60000 ms. Once a minute is
    # ample for a date and costs nothing; do not lower it without reason, since
    # each tick forks a process while the machine is meant to be idle.
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(255, 255, 255)
    font_size = 25
    font_family = $font
    # 150px below the clock above
    position = -30, -150
    halign = right
    valign = top
}


# --- Keyboard layout (bottom right) ------------------------------------------
label {
    monitor =
    # current xkb layout
    text = $LAYOUT
    color = rgb(255, 255, 255)
    font_size = 16
    font_family = $font
    # Clickable: cycles layouts from the lock screen, so a password typed under
    # the wrong layout is recoverable without rebooting.
    onclick = hyprctl switchxkblayout all next
    position = -10, 10
    halign = right
    valign = bottom
}


# --- Battery (bottom left) ---------------------------------------------------
label {
    monitor =
    # Script formats percentage plus charging state. Every 3 s, so plugging the
    # charger in while locked shows up promptly.
    text = cmd[update:3000] $HOME/.config/hypr/scripts/lock-battery.sh
    color = rgba(255, 255, 255, 1.0)
    font_size = 15
    font_family = $font
    # sits above the username label below
    position = 12, 38
    halign = left
    valign = bottom
}


# --- Username (bottom left corner) -------------------------------------------
label {
    monitor =
    text = $USER
    # dimmer than the rest: context, not content
    color = rgba(200, 200, 200, 1.0)
    font_size = 16
    font_family = $font
    position = 10, 10
    halign = left
    valign = bottom
}
