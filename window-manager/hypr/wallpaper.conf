# Single source of truth for the desktop wallpaper path.
#
# Split into its own file so that both consumers read the same value:
#   ~/.config/hypr/hyprpaper.conf  — draws it on the desktop
#   ~/.config/hypr/hyprlock.conf   — draws it behind the lock screen
# Change the path here and both follow. ~/.config/hypr/scripts/apply-wallpaper.sh
# rewrites this line, so keep the `$wallpaper = <path>` shape intact.
#
# Must be an absolute path — hyprpaper does not expand ~.
$wallpaper = /home/kairav/media/pictures/wallpapers/wallppr.jpg
