# Single source of truth for the desktop wallpaper path.
#
# Split into its own file so that every consumer reads the same value:
#   ~/.config/hypr/hyprpaper.conf  — draws it on the desktop
#   ~/.config/hypr/hyprlock.conf   — draws it behind the lock screen
#   ~/.local/bin/theme-switch      — derives the `auto` palette from it
# Change the path here and all three follow. ~/.config/hypr/scripts/apply-wallpaper.sh
# rewrites this line in place (it patches the single line and leaves these
# comments alone), so keep the `$wallpaper = <path>` shape intact.
#
# Must be an absolute path — hyprpaper does not expand ~.
$wallpaper = /home/kairav/media/pictures/wallpapers/wallhaven-4lepol.jpg
